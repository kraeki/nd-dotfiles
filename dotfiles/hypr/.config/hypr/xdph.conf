# xdg-desktop-portal-hyprland (XDPH) -- screen sharing behaviour.
# See hyprland.lua AUTOSTART for the systemd/graphical-session.target bootstrap
# that makes the portal reachable in the first place.

screencopy {
    # Stop re-prompting for the display on every re-negotiation.
    #
    # Chrome/Meet asks for persist_mode=1 ("remember for the life of the app")
    # on every ScreenCast session, but XDPH only issues a restore token if the
    # picker's "allow token" box is ticked -- and it is NOT ticked by default.
    # So no token is ever stored and the journal shows, every single time:
    #     [screencopy] restore data invalid / missing, prompting
    # Chrome opens a fresh session whenever a stream dies, so one call can pop
    # the picker several times in a row. Pre-approving the token makes those
    # follow-up sessions restore silently.
    allow_token_by_default = true
}
