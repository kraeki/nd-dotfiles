# xdg-desktop-portal-hyprland (XDPH) -- screen sharing behaviour.
# See hyprland.lua AUTOSTART for the systemd/graphical-session.target bootstrap
# that makes the portal reachable in the first place.

screencopy {
    # The picker: a rofi menu instead of the bundled Qt hyprland-share-picker,
    # and -- the point of the exercise -- one that caches its answer, so a
    # single "present now" prompts once instead of twice. Chrome opens three
    # ScreenCast sessions per share and burns the single-use restore token on
    # one it never starts; see the header of share-picker for the full trace.
    # Absolute path: hyprlang does not expand ~.
    custom_picker_binary = /home/kraeki/.local/share/bin/share-picker

    # Deliberately OFF, and not the fix it looks like. Pre-approving the
    # restore token does make Chrome's *second* session restore silently, but
    # that consumes the token (xdg-desktop-portal hands them out one-shot) and
    # the third session prompts anyway -- which is exactly the double prompt
    # this used to be here to solve. Worse, a token that does survive silently
    # re-shares the old source days later, so a fresh pick is ignored.
    # The picker's cache handles the burst instead.
    allow_token_by_default = false
}
