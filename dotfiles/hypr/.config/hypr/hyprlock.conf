background {
    monitor =
    #color = rgba(40, 42, 54, 1.0) # Dracula background
    color = rgba(0, 0, 0, 1.0) # all black to save energy 
}

# Catppuccin Mocha, teal accent -- the system theme (theme.nix), and the same
# teal #94e2d5 the ndos wordmark above is drawn in (branding/logo.svg). This was
# the last Dracula holdout in the repo: purple/lavender ring, Dracula fg, and a
# Dracula-background inner fill that only went unnoticed because its alpha is 0.
#
# There is deliberately no capslock_color: kb_options maps caps:super, so Caps
# Lock cannot engage on this machine and the warning would be dead weight.
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(1e1e2e00) # no fill -- the black background shows through

    # The mark above is teal at 35% alpha; the ring is teal at full strength, so
    # the live element reads louder than the branding without a second hue.
    outer_color = rgba(94e2d5ee) rgba(89dcebed) 45deg   # teal to sky
    check_color = rgba(a6e3a1ee) rgba(94e2d5de) 120deg  # green to teal
    fail_color = rgba(f38ba8ee) rgba(f5c2e7ee) 40deg    # red to pink

    font_color = rgb(205, 214, 244) # Mocha text
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

# ndos wordmark — the Delta Corps Priest 1 mark from branding/,
# rendered by branding/mk-lockmark. It is an image, not a label, because
# hyprlock labels are single-line and the mark is eight rows of block glyphs.
# The dim teal and the peach ❯ are baked into the PNG: the image widget has no
# color or opacity keys, and black must stay black here (energy saving).
image {
    monitor =
    path = ~/.config/hypr/branding/nd-lock.png
    # The PNG is square (574x574, mark centred) so this is both sides and the
    # render is 1:1 — the widget scales by the lesser side. Regenerate the PNG
    # rather than changing this number, or the block edges blur.
    size = 574
    # Must be set: rounding defaults to -1, which crops the image to a circle
    # and would clip both ends off the wordmark.
    rounding = 0
    border_size = 0
    position = 0, 230
    halign = center
    valign = center
}
